<body>



		<div class="login">
			<div class="login-in">
				<div class="logo-name">
					<h1>
						<a href="http://collabtive.o-dyn.de/" title="Collabtive Open Source Project Management">
							<img src="./templates/standard/theme/standard/images/logo-a.png" alt="Collabtive">
						</a>
					</h1>
					<h2>Projectmanagement</h2>
				</div>

				<form id="loginform" name="loginform" method="post" action="manageuser.php?action=login" onsubmit="return validateCompleteForm(this,'input_error');">
					<fieldset>

						<div class="row">
							<label for="username" class="username"></label>
							<input type="text" class="text" name="username" id="username" required="1" realname="Name">
						</div>
	
						<div class="row">
							<label for="pass" class="pass"></label>
							<input type="password" class="text" name="pass" id="pass" realname="Password">
						</div>
	
						<div class="row">
							<label for="stay" class="keep" onclick="toggleClass(this,'keep','keep-active');"><span>Stay logged in</span></label>
							<input type="checkbox" name="staylogged" id="stay" value="1">
						</div>
	
						<div class="row">
							<button type="submit" class="loginbutn" title="Login" onfocus="this.blur();"></button>
						</div>
					
					</fieldset>
				</form>
				
			</div>

					</div>
		
	
</body></html>
