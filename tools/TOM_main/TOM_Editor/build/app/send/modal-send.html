<div id="modalSend" class="modal modal-fixed-footer" materialize="modal" [materializeParams]="[{dismissible: true}]">
  <form #f="ngForm">
    <div class="modal-content">
      <h4>Create a new form</h4>

      <div class="row">
        <div class="input-field col s6">
          <select [(ngModel)]="send.element" (ngModelChange)="checkMapping($event)" name="element" materialize="material_select" [materializeSelectOptions]="elementOptions" id="sendElement" required>
            <option *ngFor="let key of elementOptions; let i = index" [value]="i">{{key}}</option>
          </select>
          <label for="sendElement">Select the type of element you want to send</label>
        </div>
        <div class="input-field col s6" *ngIf="send.element==2 || send.element==3">
          <input class="validate" type="text" id="sendValue" placeholder="data value" [(ngModel)]="send.value" name="value" required>
          <label for="sendValue">data value</label>
        </div>
      </div>
      <div class="row">
        <div class="col s12">
          <input type="checkbox" id="sendRequired" value="true" [(ngModel)]="send.required" name="required"/>
          <label for="sendRequired">This value is required</label>
        </div>
      </div>

      <!-- MUTATION FIELDS -->
      <div class="row">
        <div class="col s12">
          <input type="checkbox" id="sendMutation" value="true" [(ngModel)]="send.mutationSelected" name="mutationSelected"/>
          <label for="sendMutation">I want to add a mutation to this field</label>
        </div>
      </div>
      <div class="row" *ngIf="send.mutationSelected"><div class="col s12"><strong>Mutation definition</strong></div></div>
      <div class="row" *ngIf="send.mutationSelected">
        <div class="input-field col s6">
          <select [(ngModel)]="send.mutation.type" name="type" materialize="material_select" [materializeSelectOptions]="mutationOptions" id="sendMutationType" required>
            <option *ngFor="let key of mutationOptions; let i = index" [value]="i">{{key}}</option>
          </select>
          <label for="sendMutationType">Type of mutation</label>
        </div>
        <div class="input-field col s6" *ngIf="send.mutation.type==2">
          <input class="validate" type="text" id="sendMutationValue" placeholder="Mutation data value" [(ngModel)]="send.mutation.value" name="value" required>
          <label for="sendMutationValue">Mutation data value</label>
        </div>
      </div>
      <div class="row" *ngIf="send.mutationSelected">
        <div class="col s12">
          <input type="checkbox" id="sendMutationFail" value="true" [(ngModel)]="send.mutation.gonnaFail" name="gonnaFail"/>
          <label for="sendMutationFail">Gonna fail this test?</label>
        </div>
      </div>

      <!-- MAPPING FIELDS -->
      <div class="row">
        <div class="col s12">
          <strong>Mapping definition</strong>
          <h6>Select the method to mapping this form transition</h6>
        </div>
      </div>
      <div class="row">
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn" (click)="getElement()" *ngIf="!selectElement"><i class="material-icons left">select_all</i>SELECT AN ELEMENT<i class="material-icons right">select_all</i></a>
          <a class="waves-effect waves-light btn orange lighten-1" (click)="cancelElementSelection()" *ngIf="selectElement"><i class="material-icons left">select_all</i>cancel element selection<i class="material-icons right">select_all</i></a>
        </div>
      </div>
      <!-- MAPPING DATA, IF MANUAL MODE ARE SELECTED -->
      <div class="row" *ngIf="!selectElement">
        <div class="input-field col s12 m6">
          <select [(ngModel)]="send.map.howToFind" name="howToFind" materialize="material_select" [materializeSelectOptions]="locators" id="sendMapHowFind" >
            <option *ngFor="let key of locators; let i = index" [value]="i">{{key}}</option>
          </select>
          <label for="sendMapHowFind">How to find</label>
        </div>
        <div class="input-field col s12 m6">
          <input class="validate" type="text" id="sendMapWhatFind" placeholder="What to find" [(ngModel)]="send.map.whatToFind" name="whatToFind" required>
          <label for="sendMapWhatFind">What to find</label>
        </div>
        <div class="input-field col s12 m6">
          <select [(ngModel)]="send.map.whatToDo" name="whatToDo" materialize="material_select" [materializeSelectOptions]="actions" id="sendMapWhatDo">
            <option *ngFor="let key of actions; let i = index" [value]="i">{{key}}</option>
          </select>
          <label for="sendMapWhatDo">What to do</label>
        </div>
        <div class="input-field col s12 m6">
          <input class="validate" type="text" id="sendMapTypeAction" placeholder="Type of action" [(ngModel)]="send.map.typeOfAction" name="typeOfAction">
          <label for="sendMapTypeAction">Type of action</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn modal-action modal-close waves-effect waves-green btn-modal" [disabled]="!f.valid" [class.disabled]="!f.valid" (click)="onSubmit(f.valid)">Submit</button>
      <button type="button" class="btn-modal modal-close waves-effect waves-green btn-flat" (click)="resetModal()">Close</button>
    </div>
  </form>
</div>
