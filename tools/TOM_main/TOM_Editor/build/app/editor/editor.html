<!-- PREVIOUS TINY NAVBAR -->
<as-navtools (deletedAll)="deletedAll($event)"></as-navtools>

<div class="divider"></div>

<!-- EDITOR PANELS -->
<div class="editor-container">
  <div class="row">
    <!-- BOX Editor -->

    <div class="col s9 m9">
      <div class="row">
        <div class="col s12">
          <span>Testing {{urlDomainTitle}}</span>
          <!-- <a (click)="modelVerification()">Model Verification</a> -->
        </div>
      </div>
      <div class="row">
        <as-state *ngFor="let state of states"
          (click)="onSelect(state)"
          [state]="state"
          [selectedState]="selectedState"
          (selectedForm)="selectedForm($event)"
          (deletedState)="deletedState($event)"
          (editedValidation)="editedValidation($event)"
          (editedTransition)="editedTransition($event)"
          (editedForm)="editedForm($event)"
          (editedSend)="editedSend($event)"></as-state>
      </div>
    </div>

    <!-- sidenav -->
    <div class="col s3 m3">
      <as-sidebar [state]="selectedState"></as-sidebar>
    </div>
  </div>
</div>

<as-modal-validation [state]="selectedState" [form]="activeForm" [validation]="validationObject"></as-modal-validation>
<as-modal-transition [state]="selectedState" [transition]="transitionObject"></as-modal-transition>
<as-modal-form [state]="selectedState" [form]="formObject"></as-modal-form>
<as-modal-send [form]="activeForm" [send]="sendObject"></as-modal-send>
<as-modal-export-data></as-modal-export-data>
<as-modal-open-data (changeStatesData)="changeStatesData($event)"></as-modal-open-data>
