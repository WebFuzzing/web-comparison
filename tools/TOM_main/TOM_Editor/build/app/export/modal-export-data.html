<div id="modalExport" class="modal" materialize="modal">
  <div class="modal-content">
    <h4 class="collection-header">Export Options</h4>

    <ul class="collection">
      <li class="collection-item">
        <div class="item">
          State Machine Model
          <a class="secondary-content" (click)="downloadStateMachine()"><i class="material-icons pointer">get_app</i></a></div>
      </li>
      <li class="collection-item">
        <div class="item">
          Mapping Model
          <a class="secondary-content" (click)="downloadMapping()"><i class="material-icons pointer">get_app</i></a></div>
      </li>
      <li class="collection-item">
        <div class="item">
          Values Model
          <a class="secondary-content" (click)="downloadValues()"><i class="material-icons pointer">get_app</i></a></div>
      </li>
      <li class="collection-item">
        <div class="item">
          Mutation Model
          <a class="secondary-content" (click)="downloadMutation()"><i class="material-icons pointer">get_app</i></a></div>
      </li>
      <li class="collection-item">
        <div class="item">
          All the files
          <a class="secondary-content" (click)="allFiles()"><i class="material-icons pointer">get_app</i></a></div>
      </li>
    </ul>
  </div>
  <div class="modal-footer">
    <a class=" modal-action modal-close waves-effect waves-green btn-flat">Close</a>
  </div>
</div>
