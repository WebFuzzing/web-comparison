<div id="modalUpload" class="modal"
  materialize="modal" [materializeParams]="[{dismissible: true, opacity: 0.5}]" >

  <div class="modal-content">
    <h4 class="collection-header">Upload a file module</h4>
    <form id="moduleFileName">
    <div class="row" >
      <div class="col s12">
        <div class="file-field input-field">
          <div class="btn">
            <span>File</span>
            <input type="file" (change)="onChange($event)">
          </div>
          <div class="file-path-wrapper">
            <input class="file-path validate" type="text" >
            <textarea name="textAreaFileData" id="textAreaFileData" [hidden]="true"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn modal-action modal-close waves-effect waves-green btn-modal" [disabled]="!validForm" [class.disabled]="!validForm" (click)="onSubmit()">Submit</button>
      <button type="button" class="btn-modal modal-close waves-effect waves-green btn-flat" (click)="resetModal()">Close</button>
    </div>
    </form>
  </div>
</div>
