version: "3.9"

services:
  web:
    build: .
    container_name: mantisbt-web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.5
    container_name: mantisbt-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mantisbt
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    command: --sql-mode=""
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
