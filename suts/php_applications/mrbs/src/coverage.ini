; Xdebug 2.x (PHP 5.4 / 5.6)
xdebug.coverage_enable = 1
xdebug.remote_enable    = 0

; Xdebug 3.x (PHP 7.4 / 8.4) — these keys are ignored on 2.x
xdebug.mode             = coverage
xdebug.start_with_request = no

; Hook every request — no app code changes needed
auto_prepend_file = /coverage-scripts/coverage_start.php
auto_append_file  = /coverage-scripts/coverage_stop.php