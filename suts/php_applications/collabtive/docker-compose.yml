services:
  web:
    build: .
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html
      # mount the shared scripts (read-only)
      - ./coverage-scripts:/coverage-scripts:ro
      # bind-mount output folder so coverage files appear on the host
      - ./coverage:/var/www/coverage
    depends_on:
      - db
    networks:
      - collabtive-net

  db:
    image: mysql:5.7
    container_name: collabtive-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: collabtive
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - collabtive-net

volumes:
  dbdata:

networks:
  collabtive-net:
