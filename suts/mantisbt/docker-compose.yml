services:

  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-mitm.csv}
    command: >
      mitmdump
        --mode reverse:http://web:80
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ../minlog.py:/addons/minlog.py:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - web
    networks:
      - mantisbt-net

  web:
    build: .
    container_name: mantisbt-web
    #ports:
    #  - "8080:80"
    volumes:
      - ./src:/var/www/html
      # mount the shared scripts (read-only)
      - ./coverage-scripts:/coverage-scripts:ro
      # bind-mount output folder so coverage files appear on the host
      - ./coverage:/var/www/coverage
    depends_on:
      - db
    networks:
      - mantisbt-net

  db:
    image: mysql:5.5
    container_name: mantisbt-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mantisbt
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    command: --sql-mode=""
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - mantisbt-net
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8090:80"          # Access via http://localhost:8090
    environment:
      PMA_HOST: db         # Name of your MySQL service
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - mantisbt-net
volumes:
  dbdata:

networks:
  mantisbt-net:
    driver: bridge