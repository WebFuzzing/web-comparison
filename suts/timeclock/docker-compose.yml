version: "3.9"

services:
  web:
    build: .
    container_name: timeclock-web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - timeclock-net

  db:
    image: mysql:5.5
    container_name: timeclock-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timeclock
      MYSQL_USER: username
      MYSQL_PASSWORD: passwordtimeclock
    command: --sql-mode=""
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - timeclock-net

volumes:
  dbdata:

networks:
  timeclock-net:
