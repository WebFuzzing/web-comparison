version: '3.8'

services:
    wildfly:
        build: 
            context: ..
            dockerfile: petstore/Dockerfile
        ports:
            - "8080:8080"
            - "9990:9990"
            - "6300:6300"
        environment:
            - WILDFLY_USER=admin
            - WILDFLY_PASSWORD=admin
        depends_on:
            - postgres
    
    postgres:
        image: postgres:13
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: