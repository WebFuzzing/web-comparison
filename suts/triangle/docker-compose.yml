services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-mitm.csv}
    command: >
      mitmdump
        --mode reverse:http://web:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ../minlog.py:/addons/minlog.py:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - web
    networks:
      - triangle-network

  web:
    container_name: triangle-web
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    ports:
      - "6300:6300"
    networks:
      - triangle-network

networks:
  triangle-network:
    driver: bridge