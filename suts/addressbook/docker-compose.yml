services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-mitm.csv}
    command: >
      mitmdump
        --mode reverse:http://web:80
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ../minlog.py:/addons/minlog.py:ro    # ← up one level, mount file directly
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - web
    networks:
      - addressbook-net

  web:
    build: .
    container_name: addressbook-web
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
      - ./coverage-scripts:/coverage-scripts:ro
      - ./coverage:/var/www/coverage
    depends_on:
      - db
    networks:
      - addressbook-net

  db:
    image: mysql:5.6
    container_name: addressbook-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: addressbook
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    command: --sql-mode=""
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - addressbook-net

volumes:
  dbdata:

networks:
  addressbook-net: