services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      # mount the shared scripts (read-only)
      - ./coverage-scripts:/coverage-scripts:ro
      # bind-mount output folder so coverage files appear on the host
      - ./coverage:/var/www/coverage
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: schoolmate
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    command: --sql-mode=""
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
